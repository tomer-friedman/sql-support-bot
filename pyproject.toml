[project]
name = "sql-support-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.1.0",
    "notebook>=7.0.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.0",
    "deepagents>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "langsmith>=0.6.3",
]

[tool.pytest.ini_options]
testpaths = ["evals"]
addopts = "-v --tb=short"
